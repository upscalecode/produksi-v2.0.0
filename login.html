<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="assets/images/faviconAbsh.png?v=2"
    />
    <title>Login — Laporan Produksi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css?v=20261009-operator-division-v1" />
  </head>
  <body data-page="login">
    <main class="login-screen">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-mark">
          <img
            src="assets/images/logogram.png"
            alt="Logo ABSH"
            class="brand-logo"
          />
          <div>
            <p class="eyebrow">PT. ABSH FRAGRANCE CREATIONS</p>
            <h1 id="loginTitle">LAPORAN PRODUKSI</h1>
          </div>
        </div>

        <p class="login-sub">Login Produksi Filling &amp; Press.</p>

        <form id="loginForm" class="login-form" autocomplete="off">
          <label class="field">
            <span>Username</span>
            <input
              type="text"
              id="loginUsername"
              required
              autocomplete="username"
              placeholder="Username"
            />
          </label>

          <label class="field">
            <span>Password</span>
            <input
              type="password"
              id="loginPassword"
              required
              autocomplete="current-password"
              placeholder="••••••••"
            />
            <!-- <button type="button" id="togglePassword" class="togglePassword">👁️</button> -->
          </label>

          <p id="loginError" class="form-error" hidden></p>
          <button
            id="loginSubmit"
            type="submit"
            class="btn btn-primary btn-block"
          >
            Login
          </button>
        </form>

        <div class="login-hint">
          <p><strong>Status koneksi</strong></p>
          <p id="loginConnectionText">Siap untuk login</p>
        </div>
      </section>
    </main>

    <script src="script.js?v=20261009-operator-jabatan-v3"></script>
  </body>
</html>
